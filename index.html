<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <header>
        <h1>Task Manager</h1>
        <button id="themebtn">Dark Mode</button>
    </header>

    <main>


    

           <section id="addtasksection">

            <h2>Add New Task</h2>
 
                  <form id="taskform">

                    <input type="text" id="taskinput" placeholder="Enter your task...">

                    <select id="categoryinput">
                        <option value="Work"> Work</option>
                        <option value="Personal"> Personal</option>
                        <option value="Study"> Study</option>
                    </select>

                    <select id="priorityinput">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>

                    <button type="submit"> Add Task</button>
                  </form>


           </section>

           <!--Task counter-->

           <section id="taskcounter">

            <div>
                <h3>Total Task</h3>
                <p id="totalcount">0</p>
            </div>

            <div>
                <h3>Active Task</h3>
                <p id="activetask">0</p>
            </div>

            <div>
                <h3>Completed Task</h3>
                <p id="Completedcount">0</p>
            </div> 
           </section>


           <!-- search and filters-->

           <section id="filtersection">
            <input type="text" id="searchinput" placeholder="Search tasks...">
            
            <select  id="categoryfilter">
                <option value="all">All Categories</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Study">Study</option>
            </select>

            <select  id="statusfilter">
                <option value="all">All Status</option>
                <option value="active">Active</option>
                <option value="completed">Completed</option>
            </select>

            <select  id="sortSelect">
                <option value="newest">Newest First</option>
                <option value="oldest">Oldest first</option>
                <option value="high-low">High to Low</option>
                <option value="low-high">Low to High Priority </option>
            </select>
           </section>

           <!--Task list-->

           <section id="tasksection">
            <h2>    My Tasks</h2>

            <div id="tasklist"></div>

            <p id="emptymessage">You don't have any task yet. Add one !</p>
           </section>

           <!--clear complted-->
           <section>
            <button id="clearcompletedbtn"> Clear Completed</button>
           </section>

    </main>
    

    <script src="script.js"></script>
</body>
</html>
